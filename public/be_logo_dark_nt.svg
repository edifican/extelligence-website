<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 52" width="338" height="52">
  <defs>
    <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap');]]></style>
    <filter id="dGM" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dGH" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ICON — nested SVG preserves viewBox geometry -->
  <svg x="0" y="2" width="50" height="50" viewBox="0 0 80 80" overflow="visible" fill="none">

    <!-- Orthogonal reference lines: horizontal at ground, vertical at left wall -->
    <line x1="2"  y1="70" x2="76" y2="70" stroke="#0FCFCF" stroke-width="0.55" stroke-opacity="0.13"/>
    <line x1="20" y1="2"  x2="20" y2="78" stroke="#0FCFCF" stroke-width="0.55" stroke-opacity="0.13"/>

    <!-- Face fills — front face, right faces (shadow), top ledges (catchlight) -->
    <polygon points="20,70 46,70 46,50 42,50 42,34 38,34 38,20 35,20 35,14 31,14 31,20 28,20 28,34 24,34 24,50 20,50" fill="rgba(15,207,207,0.09)"/>
    <polygon points="46,70 56,66 56,46 46,50" fill="rgba(6,130,130,0.07)"/>
    <polygon points="42,50 52,46 52,30 42,34" fill="rgba(6,130,130,0.06)"/>
    <polygon points="38,34 48,30 48,16 38,20" fill="rgba(6,130,130,0.06)"/>
    <polygon points="35,20 45,16 45,10 35,14" fill="rgba(6,130,130,0.06)"/>
    <polygon points="46,50 56,46 52,46 42,50" fill="rgba(15,207,207,0.16)"/>
    <polygon points="42,34 52,30 48,30 38,34" fill="rgba(15,207,207,0.14)"/>
    <polygon points="38,20 48,16 45,16 35,20" fill="rgba(15,207,207,0.13)"/>
    <polygon points="31,14 41,10 45,10 35,14" fill="rgba(15,207,207,0.20)"/>

    <!-- Inner ledge lines: oblique depth cues -->
    <line x1="46" y1="50" x2="56" y2="46" stroke="#0FCFCF" stroke-width="1.1"  stroke-opacity="0.60" filter="url(#dGM)"/>
    <line x1="42" y1="50" x2="52" y2="46" stroke="#0FCFCF" stroke-width="0.85" stroke-opacity="0.38"/>
    <line x1="42" y1="34" x2="52" y2="30" stroke="#0FCFCF" stroke-width="1.1"  stroke-opacity="0.60" filter="url(#dGM)"/>
    <line x1="38" y1="34" x2="48" y2="30" stroke="#0FCFCF" stroke-width="0.85" stroke-opacity="0.38"/>
    <line x1="38" y1="20" x2="48" y2="16" stroke="#0FCFCF" stroke-width="1.1"  stroke-opacity="0.60" filter="url(#dGM)"/>
    <line x1="35" y1="20" x2="45" y2="16" stroke="#0FCFCF" stroke-width="0.85" stroke-opacity="0.38"/>
    <line x1="31" y1="14" x2="41" y2="10" stroke="#0FCFCF" stroke-width="0.85" stroke-opacity="0.52" filter="url(#dGM)"/>

    <!-- Front face structural edges: stepped right profile + floor lines -->
    <path d="M46,70 L46,50 L42,50 L42,34 L38,34 L38,20 L35,20 L35,14 L31,14"
          fill="none" stroke="#0FCFCF" stroke-width="1.0" stroke-opacity="0.32" stroke-linejoin="round"/>
    <line x1="20" y1="50" x2="46" y2="50" stroke="#0FCFCF" stroke-width="0.7" stroke-opacity="0.22"/>
    <line x1="24" y1="34" x2="42" y2="34" stroke="#0FCFCF" stroke-width="0.7" stroke-opacity="0.20"/>
    <line x1="28" y1="20" x2="38" y2="20" stroke="#0FCFCF" stroke-width="0.7" stroke-opacity="0.18"/>
    <line x1="31" y1="14" x2="35" y2="14" stroke="#0FCFCF" stroke-width="0.7" stroke-opacity="0.16"/>

    <!-- Outer electric trace — 4 layers: wide haze → tight glow → sharp edge -->
    <path d="M20,70 L46,70 L56,66 L56,46 L52,46 L52,30 L48,30 L48,16 L45,16 L45,10 L41,10 L31,14 L31,20 L28,20 L28,34 L24,34 L24,50 L20,50Z" fill="none" stroke="#0FCFCF" stroke-width="11"  stroke-opacity="0.04" stroke-linejoin="round"/>
    <path d="M20,70 L46,70 L56,66 L56,46 L52,46 L52,30 L48,30 L48,16 L45,16 L45,10 L41,10 L31,14 L31,20 L28,20 L28,34 L24,34 L24,50 L20,50Z" fill="none" stroke="#0FCFCF" stroke-width="5"   stroke-opacity="0.10" stroke-linejoin="round"/>
    <path d="M20,70 L46,70 L56,66 L56,46 L52,46 L52,30 L48,30 L48,16 L45,16 L45,10 L41,10 L31,14 L31,20 L28,20 L28,34 L24,34 L24,50 L20,50Z" fill="none" stroke="#26F6F6" stroke-width="2.5"  stroke-opacity="0.25" stroke-linejoin="round"/>
    <path d="M20,70 L46,70 L56,66 L56,46 L52,46 L52,30 L48,30 L48,16 L45,16 L45,10 L41,10 L31,14 L31,20 L28,20 L28,34 L24,34 L24,50 L20,50Z" fill="none" stroke="#26F6F6" stroke-width="1.3"  stroke-opacity="0.97" stroke-linejoin="round"/>

    <!-- Base accent: heavier ground line anchors the building -->
    <path d="M20,70 L46,70 L56,66" fill="none" stroke="#26F6F6" stroke-width="2.2" stroke-opacity="0.90" stroke-linejoin="round" filter="url(#dGM)"/>

    <!-- Corner data nodes -->
    <g filter="url(#dGH)">
      <circle cx="45" cy="10" r="2.0" fill="#30FFFF" opacity="1.0"/>
      <circle cx="41" cy="10" r="2.0" fill="#22F4F4" opacity="0.88"/>
      <circle cx="46" cy="70" r="2.6" fill="#1AEFEF" opacity="0.92"/>
      <circle cx="20" cy="70" r="2.0" fill="#10E8E8" opacity="0.80"/>
      <circle cx="56" cy="66" r="2.0" fill="#10E8E8" opacity="0.80"/>
    </g>
    <g filter="url(#dGM)">
      <circle cx="56" cy="46" r="2.0" fill="#0FCFCF" opacity="0.92"/>
      <circle cx="52" cy="46" r="1.5" fill="#0FCFCF" opacity="0.68"/>
      <circle cx="52" cy="30" r="1.9" fill="#0FCFCF" opacity="0.88"/>
      <circle cx="48" cy="30" r="1.4" fill="#0FCFCF" opacity="0.62"/>
      <circle cx="48" cy="16" r="1.8" fill="#0FCFCF" opacity="0.85"/>
      <circle cx="45" cy="16" r="1.4" fill="#0FCFCF" opacity="0.58"/>
      <circle cx="20" cy="50" r="1.6" fill="#0FCFCF" opacity="0.78"/>
      <circle cx="24" cy="50" r="1.3" fill="#0FCFCF" opacity="0.58"/>
      <circle cx="24" cy="34" r="1.6" fill="#0FCFCF" opacity="0.75"/>
      <circle cx="28" cy="34" r="1.3" fill="#0FCFCF" opacity="0.55"/>
      <circle cx="28" cy="20" r="1.5" fill="#0FCFCF" opacity="0.72"/>
      <circle cx="31" cy="14" r="1.6" fill="#0FCFCF" opacity="0.80"/>
    </g>
  </svg>

  <!-- WORDMARK -->
  <text x="68" y="34"
        font-family="'DM Sans', 'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="23"
        letter-spacing="-0.35">
    <tspan fill="#F0F4F8">Building </tspan><tspan fill="#0FCFCF">Extelligence</tspan>
  </text>
</svg>
